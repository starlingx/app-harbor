---
- project:
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-harbor-tox-py39
        - k8sapp-harbor-pylint
        - k8sapp-harbor-flake8
        - k8sapp-harbor-tox-metadata
        - k8sapp-harbor-tox-coverage
        - k8sapp-harbor-tox-security
        - k8sapp-harbor-tox-py313
        - k8sapp-harbor-tox-coverage-trixie
        - k8sapp-harbor-tox-security-trixie
        - k8sapp-harbor-tox-flake8-trixie
        - k8sapp-harbor-tox-pylint-trixie
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-harbor-tox-py39
        - k8sapp-harbor-pylint
        - k8sapp-harbor-flake8
        - k8sapp-harbor-tox-metadata
        - k8sapp-harbor-tox-coverage
        - k8sapp-harbor-tox-security
        - k8sapp-harbor-tox-py313
        - k8sapp-harbor-tox-coverage-trixie
        - k8sapp-harbor-tox-security-trixie
        - k8sapp-harbor-tox-flake8-trixie
        - k8sapp-harbor-tox-pylint-trixie
    post:
      jobs:
        - stx-harbor-app-upload-git-mirror

- job:
    name: k8sapp-harbor-tox-py39
    parent: openstack-tox-py39
    description: |
            Run py39 test for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-harbor/*
    vars:
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

# NOTE: A Trixie-specific metadata job is not needed because the metadata
# test validates app metadata YAML structure which is Python-version agnostic.
# It does not depend on Python runtime behavior that differs between 3.9/3.13.
- job:
    name: k8sapp-harbor-tox-metadata
    parent: tox
    description: |
            Run metadata test for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-harbor-pylint
    parent: tox
    description: |
            Run pylint test for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-harbor/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-harbor-flake8
    parent: tox
    description: |
            Run flake8 test for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-harbor/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-harbor-tox-coverage
    parent: tox
    description: |
            Run coverage analysis for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-harbor/*
    vars:
      tox_envlist: coverage
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'
    post-run: playbooks/upload-coverage-reports.yaml

- job:
    name: k8sapp-harbor-tox-security
    parent: tox
    description: |
            Run security analysis for k8sapp_harbor
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-harbor/*
    vars:
      tox_envlist: security
      tox_extra_args: -c python3-k8sapp-harbor/k8sapp_harbor/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'
    post-run: playbooks/upload-security-reports.yaml

- job:
    name: k8sapp-harbor-tox-py313
    parent: tox
    description: |
      Run py313 for k8sapp_harbor
    nodeset: debian-trixie-8GB
    required-projects:
