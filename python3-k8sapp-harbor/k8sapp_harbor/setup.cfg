[metadata]
name = k8sapp-harbor
summary = StarlingX sysinv extensions for harbor
long_description = file: README.rst
long_description_content_type = text/x-rst
license = Apache 2.0
author = StarlingX
author-email = starlingx-discuss@lists.starlingx.io
home-page = https://www.starlingx.io/
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.4
    Programming Language :: Python :: 3.5

[files]
packages =
    k8sapp_harbor

[global]
setup-hooks =
    pbr.hooks.setup_hook

[entry_points]
systemconfig.helm_applications =
    harbor = systemconfig.helm_plugins.harbor

systemconfig.helm_plugins.harbor =
    001_harbor = k8sapp_harbor.helm.harbor:HarborHelm

systemconfig.app_lifecycle =
    harbor = k8sapp_harbor.lifecycle.lifecycle_harbor:HarborAppLifecycleOperator

[bdist_wheel]
universal = 1
